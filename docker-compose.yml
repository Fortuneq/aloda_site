version: '3.8'

services:
  aloda-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aloda-website
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates (create these directories on host)
      - ./ssl/letsencrypt:/etc/letsencrypt:ro
      - ./ssl/nginx:/etc/nginx/ssl:ro
      # Logs
      - ./logs/nginx:/var/log/nginx
      # Custom nginx config (if you want to override)
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    networks:
      - aloda-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Add SSL certificate renewal service
  certbot:
    image: certbot/certbot:latest
    container_name: aloda-certbot
    volumes:
      - ./ssl/letsencrypt:/etc/letsencrypt
      - ./ssl/www:/var/www/certbot
      - ./logs/certbot:/var/log/letsencrypt
    command: sleep infinity
    networks:
      - aloda-network
    profiles:
      - ssl

  # Optional: Monitoring with simple uptime check
  watchtower:
    image: containrrr/watchtower:latest
    container_name: aloda-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 3600
    networks:
      - aloda-network
    profiles:
      - monitoring

networks:
  aloda-network:
    driver: bridge
    name: aloda-network

volumes:
  ssl-certs:
    name: aloda-ssl-certs
  nginx-logs:
    name: aloda-nginx-logs